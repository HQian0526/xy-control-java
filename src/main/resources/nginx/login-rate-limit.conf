# 登录接口 Nginx 限流（1Panel / OpenResty）
# 只限制 /api/wx/login、/api/auth/login，逛店下单不受影响。
# 单 IP：约 1 次/秒，瞬间最多 12 次，超出返回 429。

# ---------- ① OpenResty 全局配置 http { } 内加这一行（和 server 同级，不要放进网站配置）----------
# 1Panel：OpenResty -> 配置，在 http { 里、第一个 server 之前粘贴
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

# ---------- ② 网站配置 server { } 内、原来的 location / 或 location /api 之前粘贴 ----------
# 1Panel：网站 -> 对应站点（api.gzstarfly.com）-> 配置
# proxy_pass / header 必须和现有反代保持一致，下面按本机 8080、带 /api 上下文来写

location = /api/wx/login {
    limit_req zone=login_limit burst=12 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/auth/login {
    limit_req zone=login_limit burst=12 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

error_page 429 = @login_too_many;
location @login_too_many {
    default_type application/json;
    add_header Content-Type "application/json; charset=utf-8" always;
    return 429 '{"code":429,"msg":"登录过于频繁，请稍后再试"}';
}
